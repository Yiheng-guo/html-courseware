<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程标题</title>
<style>
:root{--bg:#10151c;--fg:#eef3f9;--muted:#abb8c8;--accent:#75e2b0}*{box-sizing:border-box}body{margin:0;background:#080c11;color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--accent)}#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));background:var(--bg);display:grid;grid-template-columns:300px 1fr;grid-template-rows:1fr 90px}aside{padding:64px 30px;border-right:1px solid #ffffff20;overflow:auto}nav{display:grid;gap:16px}nav a{color:var(--muted);font-size:24px;text-decoration:none;padding:12px;border-radius:8px}nav a[aria-current]{background:#75e2b018;color:var(--accent)}main{min-height:0;position:relative}.slide{height:100%;padding:90px 100px;overflow:auto}.slide[hidden]{display:none}.kicker{color:var(--accent);font-size:26px;letter-spacing:3px}h1{font-size:90px;line-height:1.15;max-width:1100px}h2{font-size:64px;line-height:1.2}p,li{font-size:34px;line-height:1.7;max-width:1100px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:40px}.panel{padding:40px;background:#ffffff08;border-top:3px solid var(--accent)}footer{grid-column:1/-1;display:flex;align-items:center;gap:28px;padding:15px 40px;border-top:1px solid #ffffff20}button{background:#ffffff10;border:1px solid #ffffff30;color:inherit;padding:12px 24px;border-radius:8px;font-size:24px;cursor:pointer}button:disabled{opacity:.35;cursor:default}progress{flex:1;accent-color:var(--accent)}#status{font-size:24px}small{font-size:24px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="stage"><aside><p class="kicker">COURSE</p><nav aria-label="课件目录"></nav></aside><main>
<section class="slide" data-title="开始"><p class="kicker">课程主题</p><h1>把一个问题<br>讲清楚</h1><p>替换为这节课结束后，学员能够完成的具体动作。</p><small>使用方向键或底部按钮翻页</small></section>
<section class="slide" data-title="案例对比" hidden><p class="kicker">观察差异</p><h2>同一个任务，两种做法</h2><div class="compare"><div class="panel"><p>原始做法</p><p>放入真实案例与结果。</p></div><div class="panel"><p>改进做法</p><p>指出改动及其影响。</p></div></div></section>
<section class="slide" data-title="动手练习" hidden><p class="kicker">练习</p><h2>把方法用到你的场景</h2><p>在这里填写具体任务、必要约束与完成标准。</p><p>让学员产出一个可检查的结果。</p></section>
</main><footer><button id="prev" aria-label="上一页">← 上一页</button><button id="next" aria-label="下一页">下一页 →</button><progress aria-label="课程进度" max="3" value="1"></progress><span id="status" aria-live="polite"></span></footer></div>
<script>
const slides=[...document.querySelectorAll('.slide')],nav=document.querySelector('nav'),progress=document.querySelector('progress'),prev=document.querySelector('#prev'),next=document.querySelector('#next');let current=0;
function resize(){document.querySelector('#stage').style.setProperty('--scale',Math.min(innerWidth/1920,innerHeight/1080))}addEventListener('resize',resize);resize();
const links=slides.map((s,i)=>{const a=document.createElement('a');a.textContent=s.dataset.title||`第${i+1}页`;a.href=`#slide-${i+1}`;a.onclick=e=>{e.preventDefault();show(i)};nav.append(a);return a});
function show(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>{s.hidden=n!==current;if(n!==current)s.querySelectorAll('video,audio').forEach(m=>m.pause());s.querySelectorAll('iframe[data-src]').forEach(f=>{if(n===current){if(!f.hasAttribute('src'))f.src=f.dataset.src}else f.removeAttribute('src')})});links.forEach((a,n)=>{if(n===current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});prev.disabled=current===0;next.disabled=current===slides.length-1;progress.max=slides.length;progress.value=current+1;document.querySelector('#status').textContent=`${current+1} / ${slides.length}`;history.replaceState(null,'',`#slide-${current+1}`)}
prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);
addEventListener('keydown',e=>{if(e.defaultPrevented||e.isComposing||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,button,[contenteditable]:not([contenteditable="false"]),[role="textbox"]')||document.querySelector('dialog[open],[aria-modal="true"]'))return;let n;if(['ArrowRight','PageDown',' '].includes(e.key))n=current+1;else if(['ArrowLeft','PageUp'].includes(e.key))n=current-1;else if(e.key==='Home')n=0;else if(e.key==='End')n=slides.length-1;else return;e.preventDefault();show(n)});
function fromHash(){const m=location.hash.match(/^#slide-(\d+)$/);show(m?Number(m[1])-1:0)}addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
